name: Build Android APK (CPU + GenieX NPU/GPU + LiteRT GPU)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Si subes varios archivos seguidos, solo se compila el ultimo cambio (las compilaciones viejas se cancelan solas)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Si algo se traba, GitHub corta el build a los 60 min (antes podia quedar 6 horas colgado)
    timeout-minutes: 60
    container:
      image: ghcr.io/snapdragon-toolchain/arm64-android:v0.7
      volumes:
        - /usr/share/dotnet:/host_free/dotnet
        - /usr/local/lib/android:/host_free/android
        - /opt/ghc:/host_free/ghc
        - /usr/local/.ghcup:/host_free/ghcup

    env:
      # llama.cpp del motor CPU (con vision mtmd): la version mas nueva (5 oct 2026). Si algun dia falla, volver a v0.2.0
      LLAMA_GIT_TAG: v0.6.0
      # Version de las librerias QNN de Qualcomm (NPU). Cambiala aqui si hace falta.
      QNN_VERSION: 2.47.0
      # LiteRT-LM 0.17.x esta compilado con QAIRT 2.47  Dispatch de LiteRT v2.2.0 (tambien QAIRT 2.47)
      LITERT_NPU_TAG: v2.2.0
      HEXAGON_SDK_ROOT: /opt/hexagon/6.6.0.0
      ANDROID_HOME: /opt/android-sdk

    steps:
      - name: Liberar espacio en disco
        run: |
          echo "Espacio antes:"
          df -h / || true
          rm -rf /host_free/dotnet/* /host_free/android/* /host_free/ghc/* /host_free/ghcup/* || true
          echo "Espacio despues:"
          df -h / || true

      - name: Install JDK 17, node y herramientas
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs ca-certificates git curl unzip g++ python3
          python3 --version || echo "python3 no disponible"
          if ! apt-get install -y --no-install-recommends openjdk-17-jdk-headless; then
            echo "openjdk-17 no disponible via apt, instalando Temurin 17 manualmente..."
            ARCH=$(dpkg --print-architecture)
            case "$ARCH" in
              amd64) JDK_ARCH="x64" ;;
              arm64) JDK_ARCH="aarch64" ;;
              *) echo "Arquitectura no soportada: $ARCH"; exit 1 ;;
            esac
            echo "Arquitectura detectada: $ARCH -> descargando JDK para $JDK_ARCH"
            curl -sL -o /tmp/jdk17.tar.gz "https://api.adoptium.net/v3/binary/latest/17/ga/linux/${JDK_ARCH}/jdk/hotspot/normal/eclipse"
            mkdir -p /opt/jdk17
            tar -xzf /tmp/jdk17.tar.gz -C /opt/jdk17 --strip-components=1
            echo "JAVA_HOME=/opt/jdk17" >> "$GITHUB_ENV"
            echo "/opt/jdk17/bin" >> "$GITHUB_PATH"
          fi
          java -version 2>&1 || true

      # Gradle 8.14.3: lo pide el plugin de Android 8.13.2 (compila para Android 16 / API 36)
      - name: Install Gradle 8.14.3
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          rm -f /tmp/gradle.zip
          echo "/opt/gradle-8.14.3/bin" >> "$GITHUB_PATH"

      # glslc del NDK r29: el de NDK viejos genera shaders que hacen
      # cerrar la app en la GPU Adreno 830 (llama.cpp issue #28635)
      - name: Instalar glslc de NDK r29 (Vulkan compatible con Adreno 830)
        shell: bash
        # Normalmente tarda 1-2 min. Si la descarga se cuelga, se corta a los 15 min.
        timeout-minutes: 15
        run: |
          set -eo pipefail
          # Descarga con limite: si se queda trabada (menos de 100 KB/s por 60 s) se corta y reintenta sola (hasta 5 veces)
          curl -fsSL --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 600 \
               --speed-limit 100000 --speed-time 60 \
               -o /tmp/ndk29.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          ls -lh /tmp/ndk29.zip
          mkdir -p /opt/ndk29
          # Se extrae con sus carpetas originales: glslc encuentra solo sus librerias
          unzip -q -o /tmp/ndk29.zip "android-ndk-r29/shader-tools/*" -d /opt/ndk29
          unzip -q -o /tmp/ndk29.zip "android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/lib/*" -d /opt/ndk29 || true
          unzip -q -o /tmp/ndk29.zip "android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/lib64/*" -d /opt/ndk29 || true
          rm -f /tmp/ndk29.zip
          NDK=/opt/ndk29/android-ndk-r29
          REAL=$NDK/shader-tools/linux-x86_64/glslc
          # Carpeta con libc++ (con el nombre exacto libc++.so que pide glslc)
          mkdir -p /opt/glslc29/lib
          find $NDK -name 'libc++.so*' -path '*linux-x86_64*' -not -path '*sysroot*' | tee /tmp/libcxx.txt
          while read -r f; do cp -f "$f" /opt/glslc29/lib/; done < /tmp/libcxx.txt
          if [ ! -e /opt/glslc29/lib/libc++.so ]; then
            ONE=$(ls /opt/glslc29/lib/libc++.so* | head -n 1)
            ln -sf "$ONE" /opt/glslc29/lib/libc++.so
          fi
          ls -la /opt/glslc29/lib
          # Lanzador que le indica a glslc donde esta libc++
          printf '#!/bin/sh\nexport LD_LIBRARY_PATH=/opt/glslc29/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}\nexec %s "$@"\n' "$REAL" > /opt/glslc29/glslc
          chmod +x /opt/glslc29/glslc "$REAL"
          # Prueba real: si glslc no arranca, el build se detiene aqui
          /opt/glslc29/glslc --version
          echo "CUMULUS_GLSLC=/opt/glslc29/glslc" >> "$GITHUB_ENV"

      - name: Clone repository
        run: |
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            "$GITHUB_WORKSPACE/repo"

      - name: Agregar GenieX de Qualcomm (GGUF en NPU/GPU)
        working-directory: ${{ github.workspace }}/repo
        shell: bash
        run: |
          set +e
          # GenieX: se usa SOLO la version mas reciente, bajada del GitHub oficial de Qualcomm.
          # Si algun dia esta version falla, se cambia aqui por una anterior (ej. GX="0.7.0").
          GX="0.8.0"
          mkdir -p app/libs
          if ! curl -sfL -o "app/libs/geniex-android-aar-v$GX.aar" \
               "https://github.com/qualcomm/GenieX/releases/download/v$GX/geniex-android-aar-v$GX.aar"; then
            echo "ERROR: no se pudo bajar GenieX $GX de GitHub"
            exit 1
          fi
          GXDEP='files("libs/geniex-android-aar-v'"$GX"'.aar")'
          cp -f "app/libs/geniex-android-aar-v$GX.aar" /tmp/gx.aar
          echo "GenieX version: $GX  (dependencia: $GXDEP)"
          # libggml-base.so de GenieX necesita SU libomp.so (OpenMP del NDK r29).
          # Otra libreria trae un libomp.so viejo y pickFirst se quedaba con ese ->
          # "cannot locate symbol __kmpc_dispatch_deinit". Se fija la de GenieX en jniLibs (gana siempre).
          mkdir -p /tmp/gxaar app/src/main/jniLibs/arm64-v8a
          if [ -s /tmp/gx.aar ]; then
            unzip -o -q /tmp/gx.aar 'jni/arm64-v8a/*' -d /tmp/gxaar
            ls /tmp/gxaar/jni/arm64-v8a | grep -i -E 'omp|c\+\+' || true
            for L in libomp.so libc++_shared.so; do
              if [ -f "/tmp/gxaar/jni/arm64-v8a/$L" ]; then
                cp -f "/tmp/gxaar/jni/arm64-v8a/$L" app/src/main/jniLibs/arm64-v8a/
                echo "OK: $L de GenieX fijado en jniLibs"
              fi
            done
          else
            echo "AVISO: no se pudo bajar el AAR de GenieX"
          fi
          for G in app/build.gradle app/build.gradle.kts; do
            [ -f "$G" ] || continue
            if ! grep -q 'geniex-android' "$G"; then   # (tambien detecta el .aar de GitHub)
              # dependencia (sirve igual en Groovy y en Kotlin DSL)
              GXDEP_SED=$(printf '%s' "$GXDEP" | sed 's/[\/&]/\\&/g')   # las / de la ruta del .aar no deben romper el sed
              sed -i -E '0,/^[[:space:]]*dependencies[[:space:]]*\{/s//dependencies {\n    implementation('"$GXDEP_SED"')/' "$G"
              # GenieX trae sus propias librerias QNN de Qualcomm: se quitan las de Maven para que no choquen
              sed -i -E 's#^([[:space:]]*)(implementation[ (]+["'"'"']com\.qualcomm\.qti:qnn-(runtime|litert-delegate):[^"'"'"']+["'"'"'][ )]*)#\1// \2  (lo reemplaza GenieX)#' "$G"
              # GenieX pide minSdk 27 y compileSdk 35
              sed -i -E 's/(minSdk(Version)?[[:space:]=]+)(1[0-9]|2[0-6])\b/\127/' "$G"
              sed -i -E 's/(compileSdk(Version)?[[:space:]=]+)3[0-4]\b/\135/' "$G"
              # si dos librerias traen el mismo .so, se usa uno
              if [[ "$G" == *.kts ]]; then
                printf '\nandroid {\n    packaging {\n        jniLibs { pickFirsts += setOf("**/*.so") }\n    }\n}\n' >> "$G"
              else
                printf "\nandroid {\n    packagingOptions {\n        pickFirst '**/*.so'\n    }\n}\n" >> "$G"
              fi
            fi
            echo "=== $G (lineas relevantes)"
            grep -n -E 'geniex|qnn-|minSdk|compileSdk|pickFirst' "$G"
          done
          exit 0

      # IA DE IMAGENES (crear una version nueva de una foto): stable-diffusion.cpp en su propia
      # libreria (libcumulus_sd.so), aparte del motor del chat. Si algo falla aqui, la app se compila
      # igual: solo esa funcion avisa en el chat que no vino incluida (lo demas sigue funcionando).
      - name: Compilar IA de imagenes (stable-diffusion.cpp)
        working-directory: ${{ github.workspace }}/repo
        shell: bash
        timeout-minutes: 25
        env:
          SD_GIT_TAG: master-959-d637cfb
        run: |
          set +e
          # NDK de Android que trae el contenedor de Snapdragon
          NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-${ANDROID_NDK:-}}}"
          if [ -z "$NDK" ] || [ ! -f "$NDK/build/cmake/android.toolchain.cmake" ]; then
            NDK=""
            for d in /opt/android-ndk* /opt/android-sdk/ndk/* "$ANDROID_HOME"/ndk/*; do
              [ -f "$d/build/cmake/android.toolchain.cmake" ] && NDK="$d"
            done
          fi
          echo "NDK: ${NDK:-NO ENCONTRADO}"
          if [ -z "$NDK" ]; then echo "AVISO: sin NDK, la IA de imagenes no se incluye"; exit 0; fi
          if ! command -v cmake >/dev/null; then
            apt-get install -y --no-install-recommends cmake ninja-build >/dev/null 2>&1 || true
          fi
          cmake --version | head -n 1
          rm -rf /tmp/sdcpp /tmp/sdbuild
          if ! git clone -q --depth 1 --branch "$SD_GIT_TAG" https://github.com/leejet/stable-diffusion.cpp /tmp/sdcpp; then
            echo "AVISO: no se pudo bajar stable-diffusion.cpp $SD_GIT_TAG"; exit 0
          fi
          if ! git -C /tmp/sdcpp submodule update -q --init --depth 1 ggml; then
            echo "AVISO: no se pudo bajar ggml de stable-diffusion.cpp"; exit 0
          fi
          if [ ! -f app/src/main/sdcpp/sd-jni.cpp ]; then
            echo "AVISO: falta app/src/main/sdcpp/sd-jni.cpp"; exit 0
          fi
          # El CMakeLists de esta libreria se escribe aqui (no va en el repo: asi no se confunde con el del chat)
          mkdir -p /tmp/sdwrap
          cat > /tmp/sdwrap/CMakeLists.txt <<'CMAKE_EOF'
            # ============================================================================
            # IA DE IMAGENES (libcumulus_sd.so): stable-diffusion.cpp + su propio ggml
            # Se compila APARTE del motor del chat (lo hace el workflow de GitHub y copia el
            # .so a jniLibs). Todo queda escondido dentro de la libreria: solo se ven las
            # funciones JNI, asi su ggml no se mezcla con el de llama.cpp ni con el de GenieX.
            #
            # El workflow escribe este archivo en /tmp (asi no se confunde con el CMakeLists.txt del chat)
            # y le pasa: -DSDCPP_DIR=/tmp/sdcpp -DCUMULUS_SD_JNI=app/src/main/sdcpp/sd-jni.cpp
            # ============================================================================
            cmake_minimum_required(VERSION 3.18)
            project(cumulus_sd C CXX)

            set(CMAKE_CXX_STANDARD 17)
            set(CMAKE_CXX_STANDARD_REQUIRED ON)
            set(CMAKE_POSITION_INDEPENDENT_CODE ON)
            set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)

            if (NOT CMAKE_BUILD_TYPE)
                set(CMAKE_BUILD_TYPE Release CACHE STRING "" FORCE)
            endif()
            set(CMAKE_C_FLAGS_RELEASE   "-O3 -DNDEBUG")
            set(CMAKE_CXX_FLAGS_RELEASE "-O3 -DNDEBUG")

            if (NOT SDCPP_DIR OR NOT EXISTS "${SDCPP_DIR}/CMakeLists.txt")
                message(FATAL_ERROR "Falta SDCPP_DIR (carpeta de stable-diffusion.cpp con su submodulo ggml)")
            endif()

            # stable-diffusion.cpp: solo la libreria (sin ejemplos, sin WebP/WebM, sin OpenMP)
            set(SD_BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
            set(SD_WEBP OFF CACHE BOOL "" FORCE)
            set(SD_WEBM OFF CACHE BOOL "" FORCE)
            set(SD_BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)
            set(GGML_OPENMP OFF CACHE BOOL "" FORCE)
            set(GGML_NATIVE OFF CACHE BOOL "" FORCE)
            set(GGML_BUILD_TESTS OFF CACHE BOOL "" FORCE)
            set(GGML_BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
            if (ANDROID)
                # Instrucciones rapidas del Snapdragon 8 Elite (S25): dotprod + i8mm + fp16
                set(GGML_CPU_ARM_ARCH "armv8.2-a+dotprod+i8mm+fp16" CACHE STRING "" FORCE)
            endif()

            add_subdirectory("${SDCPP_DIR}" "${CMAKE_BINARY_DIR}/stable-diffusion" EXCLUDE_FROM_ALL)

            if (NOT CUMULUS_SD_JNI)
                set(CUMULUS_SD_JNI "${CMAKE_CURRENT_SOURCE_DIR}/sd-jni.cpp")
            endif()
            add_library(cumulus_sd SHARED "${CUMULUS_SD_JNI}")
            target_link_libraries(cumulus_sd PRIVATE stable-diffusion)
            target_include_directories(cumulus_sd PRIVATE "${SDCPP_DIR}/include" "${SDCPP_DIR}/ggml/include")

            if (ANDROID)
                find_library(log-lib log)
                target_link_libraries(cumulus_sd PRIVATE ${log-lib})
                # Solo se exportan las funciones JNI  paginas de 16 KB (requisito de Google Play)
                target_link_options(cumulus_sd PRIVATE
                    "-Wl,--exclude-libs,ALL"
                    "-Wl,--gc-sections"
                    "-Wl,-z,max-page-size=16384")
            else()
                # Prueba en PC: JNI del JDK
                find_package(JNI REQUIRED)
                target_include_directories(cumulus_sd PRIVATE ${JNI_INCLUDE_DIRS})
                target_link_options(cumulus_sd PRIVATE "-Wl,--exclude-libs,ALL")
            endif()
          CMAKE_EOF
          GEN="Unix Makefiles"; command -v ninja >/dev/null && GEN=Ninja
          cmake -S /tmp/sdwrap -B /tmp/sdbuild -G "$GEN" \
            -DSDCPP_DIR=/tmp/sdcpp -DCUMULUS_SD_JNI="$PWD/app/src/main/sdcpp/sd-jni.cpp" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-34 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tail -n 25
          cmake --build /tmp/sdbuild --target cumulus_sd -j"$(nproc)" 2>&1 | grep -E "error|Error|warning: unused|Linking|cumulus_sd" | tail -n 40
          if [ -f /tmp/sdbuild/libcumulus_sd.so ]; then
            STRIP=$(ls "$NDK"/toolchains/llvm/prebuilt/*/bin/llvm-strip 2>/dev/null | head -n 1)
            [ -n "$STRIP" ] && "$STRIP" --strip-unneeded /tmp/sdbuild/libcumulus_sd.so
            mkdir -p app/src/main/jniLibs/arm64-v8a
            cp -f /tmp/sdbuild/libcumulus_sd.so app/src/main/jniLibs/arm64-v8a/
            ls -la app/src/main/jniLibs/arm64-v8a/libcumulus_sd.so
            echo "OK: IA de imagenes (stable-diffusion.cpp $SD_GIT_TAG) incluida en el APK"
          else
            echo "AVISO: no se compilo la IA de imagenes (la app sigue funcionando; solo "version nueva" avisara)"
          fi
          exit 0

      - name: Prepare Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Build APK (CPU + GenieX NPU/GPU + LiteRT)
        working-directory: ${{ github.workspace }}/repo
        env:
          HEXAGON_SDK_ROOT: /opt/hexagon/6.6.0.0
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          set +e
          echo "glslc para Vulkan: $CUMULUS_GLSLC"
          # NPU: la app necesita permiso para usar libcdsprpc.so (canal hacia la NPU)
          MANI=app/src/main/AndroidManifest.xml
          # GenieX: su plugin llama_cpp necesita libOpenCL.so (GPU Adreno) y libcdsprpc.so (NPU)
          # Sin este permiso Android le bloquea esas librerias  "Cannot registerPlugin llama_cpp"
          for LIB in libcdsprpc.so libOpenCL.so libOpenCL_adreno.so; do
            if [ -f "$MANI" ] && ! grep -q "\"$LIB\"" "$MANI"; then
              sed -i "s#</application># <uses-native-library android:name=\"$LIB\" android:required=\"false\" />\n    </application>#" "$MANI"
              echo "Manifest: agregado $LIB"
            fi
          done
          grep -n "uses-native-library" "$MANI"
          gradle assembleDebug --no-daemon --console=plain | tee /tmp/build.log
          CODE=${PIPESTATUS[0]}
          # NPU: las librerias que corren dentro de la NPU (libggml-htp-v79.so...)
          # se copian al APK y se vuelve a empaquetar (segunda pasada, rapida)
          if [ "$CODE" -eq 0 ]; then
            SKELS=$(find app/.cxx -name 'libggml-htp-v*.so' 2>/dev/null | sort -u)
            if [ -n "$SKELS" ]; then
              mkdir -p app/src/main/jniLibs/arm64-v8a
              for f in $SKELS; do cp -f "$f" app/src/main/jniLibs/arm64-v8a/; done
              echo '================= NPU (librerias HTP) ================='
              ls -la app/src/main/jniLibs/arm64-v8a/ | grep htp
              gradle assembleDebug --no-daemon --console=plain | tee -a /tmp/build.log
              CODE=${PIPESTATUS[0]}
            else
              echo " No se generaron librerias HTP (la NPU no quedara activa)"
            fi
          fi
          echo "Espacio al terminar:"
          df -h / || true
          echo '================= VULKAN ================='
          grep -n -E 'glslc elegido|Vulkan ACTIVADO|Vulkan desactivado|NPU Hexagon|hexagon: using' /tmp/build.log | head -n 12
          if [ "$CODE" -ne 0 ]; then
            echo '================= ERRORES (diagnostico) ================='
            grep -n -E 'CMake Error|error:|Error:|FAILED|not found|Could not|No space' /tmp/build.log | head -n 60
            echo '================= ERROR CMAKE (detalle) ================='
            grep -B 5 -A 25 'CMake Error' /tmp/build.log | head -n 120
            echo '========================================================='
          fi
          exit $CODE

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-full-debug
          path: ${{ github.workspace }}/repo/app/build/outputs/apk/debug/app-debug.apk


