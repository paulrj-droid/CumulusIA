name: Build Android APK (CPU + GenieX NPU/GPU + LiteRT)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/snapdragon-toolchain/arm64-android:v0.7
      volumes:
        - /usr/share/dotnet:/host_free/dotnet
        - /usr/local/lib/android:/host_free/android
        - /opt/ghc:/host_free/ghc
        - /usr/local/.ghcup:/host_free/ghcup

    env:
      LLAMA_GIT_TAG: v0.2.0
      # ⚡ Versión de las librerías QNN de Qualcomm (NPU). Cámbiala aquí si hace falta.
      QNN_VERSION: 2.47.0
      # LiteRT-LM 0.17.x está compilado con QAIRT 2.47 → Dispatch de LiteRT v2.2.0 (también QAIRT 2.47)
      LITERT_NPU_TAG: v2.2.0
      HEXAGON_SDK_ROOT: /opt/hexagon/6.6.0.0
      ANDROID_HOME: /opt/android-sdk

    steps:
      - name: Liberar espacio en disco
        run: |
          echo "Espacio antes:"
          df -h / || true
          rm -rf /host_free/dotnet/* /host_free/android/* /host_free/ghc/* /host_free/ghcup/* || true
          echo "Espacio despues:"
          df -h / || true

      - name: Install JDK 17, node y herramientas
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs ca-certificates git curl unzip g++ python3
          python3 --version || echo "python3 no disponible"
          if ! apt-get install -y --no-install-recommends openjdk-17-jdk-headless; then
            echo "openjdk-17 no disponible via apt, instalando Temurin 17 manualmente..."
            ARCH=$(dpkg --print-architecture)
            case "$ARCH" in
              amd64) JDK_ARCH="x64" ;;
              arm64) JDK_ARCH="aarch64" ;;
              *) echo "Arquitectura no soportada: $ARCH"; exit 1 ;;
            esac
            echo "Arquitectura detectada: $ARCH -> descargando JDK para $JDK_ARCH"
            curl -sL -o /tmp/jdk17.tar.gz "https://api.adoptium.net/v3/binary/latest/17/ga/linux/${JDK_ARCH}/jdk/hotspot/normal/eclipse"
            mkdir -p /opt/jdk17
            tar -xzf /tmp/jdk17.tar.gz -C /opt/jdk17 --strip-components=1
            echo "JAVA_HOME=/opt/jdk17" >> "$GITHUB_ENV"
            echo "/opt/jdk17/bin" >> "$GITHUB_PATH"
          fi
          java -version 2>&1 || true

      - name: Install Gradle 8.7
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          rm -f /tmp/gradle.zip
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      # 🎮 glslc del NDK r29: el de NDK viejos genera shaders que hacen
      #    cerrar la app en la GPU Adreno 830 (llama.cpp issue #28635)
      - name: Instalar glslc de NDK r29 (Vulkan compatible con Adreno 830)
        shell: bash
        run: |
          set -eo pipefail
          curl -sL -o /tmp/ndk29.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          mkdir -p /opt/ndk29
          # Se extrae con sus carpetas originales: glslc encuentra solo sus librerías
          unzip -q -o /tmp/ndk29.zip "android-ndk-r29/shader-tools/*" -d /opt/ndk29
          unzip -q -o /tmp/ndk29.zip "android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/lib/*" -d /opt/ndk29 || true
          unzip -q -o /tmp/ndk29.zip "android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/lib64/*" -d /opt/ndk29 || true
          rm -f /tmp/ndk29.zip
          NDK=/opt/ndk29/android-ndk-r29
          REAL=$NDK/shader-tools/linux-x86_64/glslc
          # Carpeta con libc++ (con el nombre exacto libc++.so que pide glslc)
          mkdir -p /opt/glslc29/lib
          find $NDK -name 'libc++.so*' -path '*linux-x86_64*' -not -path '*sysroot*' | tee /tmp/libcxx.txt
          while read -r f; do cp -f "$f" /opt/glslc29/lib/; done < /tmp/libcxx.txt
          if [ ! -e /opt/glslc29/lib/libc++.so ]; then
            ONE=$(ls /opt/glslc29/lib/libc++.so* | head -n 1)
            ln -sf "$ONE" /opt/glslc29/lib/libc++.so
          fi
          ls -la /opt/glslc29/lib
          # Lanzador que le indica a glslc dónde está libc++
          printf '#!/bin/sh\nexport LD_LIBRARY_PATH=/opt/glslc29/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}\nexec %s "$@"\n' "$REAL" > /opt/glslc29/glslc
          chmod +x /opt/glslc29/glslc "$REAL"
          # Prueba real: si glslc no arranca, el build se detiene aquí
          /opt/glslc29/glslc --version
          echo "CUMULUS_GLSLC=/opt/glslc29/glslc" >> "$GITHUB_ENV"

      - name: Clone repository
        run: |
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            "$GITHUB_WORKSPACE/repo"

      # ⚡ NPU para modelos .litertlm: LiteRT necesita libLiteRtDispatch_Qualcomm.so
      #    (viene en litert_npu_runtime_libraries.zip de las releases oficiales de LiteRT)
      - name: Agregar Dispatch Qualcomm de LiteRT (NPU .litertlm)
        working-directory: ${{ github.workspace }}/repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          URLS=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/google-ai-edge/LiteRT/releases?per_page=30" \
            | python3 -c "import json,sys
          for r in json.load(sys.stdin):
              for a in r.get('assets', []):
                  if a['name'] == 'litert_npu_runtime_libraries.zip':
                      print(r['tag_name'] + ' ' + a['browser_download_url'])" > /tmp/npu_rel.txt; \
            (grep "^$LITERT_NPU_TAG " /tmp/npu_rel.txt || head -n 1 /tmp/npu_rel.txt) | head -n 1)
          echo "Release elegida: $URLS"
          URL=$(echo "$URLS" | awk '{print $2}')
          if [ -n "$URL" ]; then
            curl -sL -o /tmp/npu.zip "$URL"
            mkdir -p /tmp/npu && unzip -q -o /tmp/npu.zip -d /tmp/npu
            find /tmp/npu -name 'libLiteRtDispatch_Qualcomm.so' | head -n 5
            # Preferir la versión para el Snapdragon 8 Elite (Hexagon v79)
            F=$(find /tmp/npu -path '*v79*' -name 'libLiteRtDispatch_Qualcomm.so' | head -n 1)
            [ -z "$F" ] && F=$(find /tmp/npu -path '*arm64*' -name 'libLiteRtDispatch_Qualcomm.so' | head -n 1)
            [ -z "$F" ] && F=$(find /tmp/npu -name 'libLiteRtDispatch_Qualcomm.so' | head -n 1)
            if [ -n "$F" ]; then
              cp -f "$F" app/src/main/jniLibs/arm64-v8a/
              echo "✅ Dispatch Qualcomm agregado: $F"
            else
              echo "⚠️ El zip no trae libLiteRtDispatch_Qualcomm.so"; find /tmp/npu -name '*.so' | head -n 30
            fi
          else
            echo "⚠️ No se encontró litert_npu_runtime_libraries.zip en las releases de LiteRT"
          fi
          # Librerías QNN de Qualcomm: el modelo sm8750 pide QnnSystem >= 1.8 (QAIRT 2.45+)
          echo "QNN_VERSION=$QNN_VERSION"
          for G in app/build.gradle app/build.gradle.kts; do
            if [ -f "$G" ]; then
              sed -i -E 's/(com\.qualcomm\.qti:qnn-runtime:)[0-9.]+/\1'"$QNN_VERSION"'/' "$G"
              # el delegate solo se sube si esa versión existe en Maven Central
              if curl -sfI "https://repo1.maven.org/maven2/com/qualcomm/qti/qnn-litert-delegate/$QNN_VERSION/qnn-litert-delegate-$QNN_VERSION.pom" > /dev/null; then
                sed -i -E 's/(com\.qualcomm\.qti:qnn-litert-delegate:)[0-9.]+/\1'"$QNN_VERSION"'/' "$G"
              else
                echo "⚠️ qnn-litert-delegate $QNN_VERSION no existe en Maven: se deja la versión anterior"
              fi
              grep -n 'qnn-' "$G" || true
            fi
          done
          exit 0

      # ⚡ GenieX (SDK oficial de Qualcomm): GGUF en NPU Hexagon / GPU Adreno
      - name: Agregar GenieX de Qualcomm (GGUF en NPU/GPU)
        working-directory: ${{ github.workspace }}/repo
        shell: bash
        run: |
          set +e
          GX=""
          for V in 0.4.0 0.3.1; do
            if curl -sfI "https://repo1.maven.org/maven2/com/qualcomm/qti/geniex-android/$V/geniex-android-$V.pom" > /dev/null; then GX=$V; break; fi
          done
          [ -z "$GX" ] && GX=0.4.0
          echo "GenieX version: $GX"
          for G in app/build.gradle app/build.gradle.kts; do
            [ -f "$G" ] || continue
            if ! grep -q 'geniex-android' "$G"; then
              # dependencia (sirve igual en Groovy y en Kotlin DSL)
              sed -i -E '0,/^[[:space:]]*dependencies[[:space:]]*\{/s//dependencies {\n    implementation("com.qualcomm.qti:geniex-android:'"$GX"'")/' "$G"
              # GenieX trae sus propias librerías QNN de Qualcomm: se quitan las de Maven para que no choquen
              sed -i -E 's#^([[:space:]]*)(implementation[ (]+["'"'"']com\.qualcomm\.qti:qnn-(runtime|litert-delegate):[^"'"'"']+["'"'"'][ )]*)#\1// \2  (lo reemplaza GenieX)#' "$G"
              # GenieX pide minSdk 27 y compileSdk 35
              sed -i -E 's/(minSdk(Version)?[[:space:]=]+)(1[0-9]|2[0-6])\b/\127/' "$G"
              sed -i -E 's/(compileSdk(Version)?[[:space:]=]+)3[0-4]\b/\135/' "$G"
              # si dos librerías traen el mismo .so, se usa uno
              if [[ "$G" == *.kts ]]; then
                printf '\nandroid {\n    packaging {\n        jniLibs { pickFirsts += setOf("**/*.so") }\n    }\n}\n' >> "$G"
              else
                printf "\nandroid {\n    packagingOptions {\n        pickFirst '**/*.so'\n    }\n}\n" >> "$G"
              fi
            fi
            echo "=== $G (líneas relevantes)"
            grep -n -E 'geniex|qnn-|minSdk|compileSdk|pickFirst' "$G"
          done
          exit 0

      - name: Prepare Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Build APK (CPU + GenieX NPU/GPU + LiteRT)
        working-directory: ${{ github.workspace }}/repo
        env:
          HEXAGON_SDK_ROOT: /opt/hexagon/6.6.0.0
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          set +e
          echo "glslc para Vulkan: $CUMULUS_GLSLC"
          # ⚡ NPU: la app necesita permiso para usar libcdsprpc.so (canal hacia la NPU)
          MANI=app/src/main/AndroidManifest.xml
          # ⚡ GenieX: su plugin llama_cpp necesita libOpenCL.so (GPU Adreno) y libcdsprpc.so (NPU)
          #    Sin este permiso Android le bloquea esas librerías → "Cannot registerPlugin llama_cpp"
          for LIB in libcdsprpc.so libOpenCL.so libOpenCL_adreno.so; do
            if [ -f "$MANI" ] && ! grep -q "\"$LIB\"" "$MANI"; then
              sed -i "s#</application>#    <uses-native-library android:name=\"$LIB\" android:required=\"false\" />\n    </application>#" "$MANI"
              echo "Manifest: agregado $LIB"
            fi
          done
          grep -n "uses-native-library" "$MANI"
          gradle assembleDebug --no-daemon --console=plain | tee /tmp/build.log
          CODE=${PIPESTATUS[0]}
          # ⚡ NPU: las librerías que corren dentro de la NPU (libggml-htp-v79.so...)
          #    se copian al APK y se vuelve a empaquetar (segunda pasada, rápida)
          if [ "$CODE" -eq 0 ]; then
            SKELS=$(find app/.cxx -name 'libggml-htp-v*.so' 2>/dev/null | sort -u)
            if [ -n "$SKELS" ]; then
              mkdir -p app/src/main/jniLibs/arm64-v8a
              for f in $SKELS; do cp -f "$f" app/src/main/jniLibs/arm64-v8a/; done
              echo '================= NPU (librerías HTP) ================='
              ls -la app/src/main/jniLibs/arm64-v8a/ | grep htp
              gradle assembleDebug --no-daemon --console=plain | tee -a /tmp/build.log
              CODE=${PIPESTATUS[0]}
            else
              echo "⚠️ No se generaron librerías HTP (la NPU no quedará activa)"
            fi
          fi
          echo "Espacio al terminar:"
          df -h / || true
          echo '================= VULKAN ================='
          grep -n -E 'glslc elegido|Vulkan ACTIVADO|Vulkan desactivado|NPU Hexagon|hexagon: using' /tmp/build.log | head -n 12
          if [ "$CODE" -ne 0 ]; then
            echo '================= ERRORES (diagnostico) ================='
            grep -n -E 'CMake Error|error:|Error:|FAILED|not found|Could not|No space' /tmp/build.log | head -n 60
            echo '================= ERROR CMAKE (detalle) ================='
            grep -B 5 -A 25 'CMake Error' /tmp/build.log | head -n 120
            echo '========================================================='
          fi
          exit $CODE

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-full-debug
          path: ${{ github.workspace }}/repo/app/build/outputs/apk/debug/app-debug.apk

