# Habilita el soporte para AndroidX
android.useAndroidX=true

# Desactiva Jetifier
android.enableJetifier=false

# Fuerza la desactivacion global de DataBinding
android.defaults.buildfeatures.databinding=false

# Memoria para compilar: Gradle 8.14 usa solo 512 MB por defecto y no alcanza
# (error "D8: java.lang.OutOfMemoryError: Java heap space"). GitHub tiene 16 GB.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g

