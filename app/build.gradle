plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.paulrj.cumulusia'
    //  Android 16 (API 36): lo exige Google Play para apps nuevas y actualizaciones desde el 31 de agosto de 2026
    compileSdk 36

    ndkVersion "25.1.8937393"

    defaultConfig {
        applicationId "com.cumulusia.app"
        minSdk 34
        targetSdk 36
        // Numero de version para Google Play: GitHub lo sube solo en cada compilacion (debe crecer en cada version publicada)
        versionCode((System.getenv("CUMULUS_VERSION_CODE") ?: "1").toInteger())
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17", "-g0"
                cFlags "-g0"
                arguments "-DCMAKE_BUILD_TYPE=Release",
                          "-DCMAKE_C_FLAGS_RELEASE=-O3 -g0",
                          "-DCMAKE_CXX_FLAGS_RELEASE=-O3 -g0"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        compose true
    }

    // Firma para Google Play: la llave la entrega GitHub Actions (secretos SIGNING_KEY y KEYSTORE_PASSWORD).
    // Sin llave, la version de prueba (debug) se arma igual que siempre.
    signingConfigs {
        release {
            def ks = System.getenv("CUMULUS_KEYSTORE")
            if (ks != null && new File(ks).exists()) {
                storeFile new File(ks)
                storePassword System.getenv("CUMULUS_KEYSTORE_PASSWORD")
                keyAlias "cumulus"
                keyPassword System.getenv("CUMULUS_KEYSTORE_PASSWORD")
            }
        }
    }

    // La revision automatica (lint) no detiene el archivo para Google Play
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        release {
            if (System.getenv("CUMULUS_KEYSTORE") != null) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            // El telefono usa su propio libOpenCL.so (/vendor/lib64), no el de la compilacion
            excludes += ['**/libOpenCL.so']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.17.0'
    implementation 'com.qualcomm.qti:qnn-runtime:2.42.0'
    implementation 'com.qualcomm.qti:qnn-litert-delegate:2.42.0'

    //  Editor de imagenes con IA (recortar, resolucion con IA, fondo, personas): LiteRT en NPU, GPU o CPU
    implementation 'com.google.ai.edge.litert:litert:1.4.0'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.0'
    implementation 'com.google.ai.edge.litert:litert-gpu-api:1.4.0'
    //  NPU para esas IA: delegado QNN con la MISMA version de QNN que trae GenieX 0.9.1 (QAIRT 2.50).
    //    (va escrito asi a proposito: el workflow comenta las lineas 'com.qualcomm.qti:...' de arriba)
    //    Si se vuelve a GenieX 0.8.0, esta linea vuelve a '2.45.0'.
    implementation group: 'com.qualcomm.qti', name: 'qnn-litert-delegate', version: '2.50.0'
    //  Separar a la persona u objeto del fondo (Google ML Kit, la IA se descarga sola con Google Play)
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'

    implementation("xyz.rementia:openwakeword:0.1.3")

    //  Leer el texto de archivos PDF (Word, Excel y PowerPoint se leen sin librerias)
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    implementation 'androidx.compose.ui:ui:1.6.0'
    implementation 'androidx.compose.ui:ui-graphics:1.6.0'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.6.0'
    implementation 'androidx.compose.material3:material3:1.2.0'
    implementation 'androidx.compose.material:material-icons-extended:1.6.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
}

